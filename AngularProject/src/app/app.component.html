<app-header></app-header>
<main class="dashboard">
  <section class="user-panel">
    <h2>Selected User</h2>
    <ul class="user-list">
      <li *ngFor="let user of users">
        <app-user
          [id]="user.id"
          [avatar]="user.avatar"
          [name]="user.name"
          (select)="onSelectUser($event)">
        </app-user>
      </li>
    </ul>
  </section>

  <section class="tasks-panel">
    <app-tasks [name]="getSelectedUser()?.name ?? ''"></app-tasks>
  </section>
</main>
